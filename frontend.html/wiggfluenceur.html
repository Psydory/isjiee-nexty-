<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wiggfluenceur — ISJIEE</title>

  <link rel="stylesheet" href="/css/main.css">

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
    }

    .hero {
      text-align: center;
      padding: 60px 20px;
    }

    .hero h1 {
      color: cyan;
      text-shadow: 0 0 15px cyan;
    }

    .section {
      padding: 20px;
    }

    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    .card {
      width: 260px;
      padding: 20px;
      border-radius: 15px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(8px);
      text-align: center;
      transition: 0.3s;
      box-shadow: 0 0 10px rgba(0,255,255,0.3);
    }

    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px cyan;
    }

    .btn {
      margin-top: 10px;
      padding: 10px 15px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      background: linear-gradient(45deg, cyan, purple);
      color: #fff;
    }

    .stats {
      text-align: center;
      margin-top: 20px;
    }

    .stats span {
      font-weight: bold;
      color: gold;
    }

  </style>
</head>

<body>

<!-- HERO -->
<section class="hero">
  <h1>Wiggfluenceur</h1>
  <p>Monétisez votre influence et développez votre audience</p>
</section>

<!-- ACTIONS -->
<section class="section">

  <div class="cards">

    <div class="card">
      <h3>Partager contenu</h3>
      <p>Publiez et gagnez</p>
      <button class="btn" onclick="earn('content', 3)">+3 USD</button>
    </div>

    <div class="card">
      <h3>Inviter utilisateurs</h3>
      <p>Programme referral</p>
      <button class="btn" onclick="earn('referral', 5)">+5 USD</button>
    </div>

    <div class="card">
      <h3>Live promotion</h3>
      <p>Engagement premium</p>
      <button class="btn" onclick="earn('live', 10)">+10 USD</button>
    </div>

  </div>

</section>

<!-- STATS -->
<section class="stats">
  <p>Solde : <span id="balance">0</span></p>
</section>

<!-- TRANSACTIONS -->
<section class="section">
  <h2 style="text-align:center;">Historique</h2>

  <div id="txContainer">
    <p>Chargement...</p>
  </div>
</section>

<!-- SCRIPT -->
<script type="module">

import auth from "/js/authSystem.js";
import services from "/js/services.js";
import ui from "/js/uiSystem.js";

// =========================
// AUTH
// =========================
auth.requireAuth();

// =========================
// LOAD DATA
// =========================
async function loadData() {

  try {

    const balance = await services.getBalance();
    ui.setText("balance", balance.amount);

    const txs = await services.getTransactions();

    ui.renderCards("txContainer", txs, (t) => `
      <p><strong>${t.source}</strong></p>
      <p>${t.amount} USD</p>
    `);

  } catch (err) {
    ui.showError("Erreur chargement données");
  }

}

loadData();

// =========================
// EARN
// =========================
window.earn = async (source, amount) => {

  try {

    await services.addTransaction(amount, source);

    ui.showSuccess("Gain ajouté");
    loadData();

  } catch (err) {
    ui.showError("Erreur transaction");
  }

};

</script>

</body>
</html>
