<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrepreneur Dashboard</title>

<link rel="stylesheet" href="../css/main.css">

<style>
.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.card{
background:#111827;
border-radius:16px;
padding:20px;
margin-bottom:20px;
}

.progress{
width:100%;
height:20px;
background:#1f2937;
border-radius:20px;
overflow:hidden;
}

.progress-bar{
height:100%;
width:35%;
background:#10b981;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.stat-box{
background:#111827;
padding:20px;
border-radius:16px;
text-align:center;
}
</style>

</head>
<body>

<div class="container">

<h1>Entrepreneur Dashboard</h1>

<div class="card">
<h2>Current Class</h2>

<h3 id="currentLevel">
🟢 Green Entrepreneur
</h3>

<p>
Total BAR Points:
<strong id="totalPoints">0</strong>
</p>

<div class="progress">
<div class="progress-bar" id="progressBar"></div>
</div>

<p id="nextLevel">
Next Level: Blue Entrepreneur
</p>
</div>

<div class="stats">

<div class="stat-box">
<h3>Rewards</h3>
<p id="rewardsCount">0</p>
</div>

<div class="stat-box">
<h3>Certificates</h3>
<p id="certificateCount">0</p>
</div>

<div class="stat-box">
<h3>Leaderboard Rank</h3>
<p id="userRank">#--</p>
</div>

<div class="stat-box">
<h3>Projects</h3>
<p id="projectCount">0</p>
</div>

</div>

<div class="card">
<h2>Recent Activities</h2>

<ul id="activityList">
<li>No activity yet</li>
</ul>
</div>

</div>

<script src="../js/entrepreneurs.js"></script>

</body>
</html>
