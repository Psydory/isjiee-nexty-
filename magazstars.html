<section class="magazstars-hub">

  <h2 class="section-title">✨ Médias Récents</h2>

  <div class="media-slider" id="mediaSlider"></div>

  <div class="media-actions">
    <button class="btn primary" id="viewAll">Voir tout</button>
  </div>

</section>

<style>
.magazstars-hub {
  padding: 40px 20px;
  background: radial-gradient(circle at center, #050510, #000);
  color: white;
}

.section-title {
  font-size: 1.8rem;
  margin-bottom: 20px;
  text-align: center;
  background: linear-gradient(90deg,#00f0ff,#8a2be2,#ff00cc);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.media-slider {
  display: flex;
  gap: 15px;
  overflow-x: auto;
  scroll-behavior: smooth;
}

.media-card {
  min-width: 220px;
  background: #111;
  border-radius: 15px;
  overflow: hidden;
  position: relative;
  transition: 0.4s;
}

.media-card:hover {
  transform: scale(1.08);
  box-shadow: 0 0 25px #00f0ff;
}

.media-card img,
.media-card video {
  width: 100%;
  height: 150px;
  object-fit: cover;
}

.media-info {
  padding: 10px;
  font-size: 14px;
}

.media-actions {
  text-align: center;
  margin-top: 20px;
}

.btn.primary {
  background: linear-gradient(90deg,#00f0ff,#8a2be2);
  border: none;
  padding: 10px 20px;
  border-radius: 30px;
  cursor: pointer;
}

.btn.primary:hover {
  box-shadow: 0 0 20px #00f0ff;
}
</style>

<script type="module">

import api from "/js/api-core.js";

const slider = document.getElementById("mediaSlider");

// =========================
// LOAD MEDIA FROM BACKEND
// =========================
async function loadMedia() {

  try {

    const res = await api.get("/media");

    if (!res || !res.media) {
      slider.innerHTML = "<p>Aucun média</p>";
      return;
    }

    slider.innerHTML = res.media.slice(0, 10).map(m => `
      <div class="media-card" data-id="${m.id}">
        ${
          m.type === "image"
          ? `<img src="${m.url}">`
          : `<video src="${m.url}" muted></video>`
        }
        <div class="media-info">
          <p>${m.title || "Sans titre"}</p>
        </div>
      </div>
    `).join("");

    bindClick();

  } catch (err) {
    console.error(err);
    slider.innerHTML = "<p>Erreur chargement</p>";
  }

}

// =========================
// CLICK → GO TO GALLERY
// =========================
function bindClick() {

  document.querySelectorAll(".media-card").forEach(card => {

    card.onclick = () => {
      const id = card.dataset.id;

      // stocker pour focus dans gallery
      localStorage.setItem("focusMedia", id);

      window.location.href = "/gallery.html";
    };

  });

}

// =========================
// AUTO SCROLL (SLIDE)
// =========================
function autoScroll() {
  slider.scrollLeft += 1;

  if (slider.scrollLeft >= slider.scrollWidth - slider.clientWidth) {
    slider.scrollLeft = 0;
  }
}

setInterval(autoScroll, 30);

// =========================
// BUTTON VIEW ALL
// =========================
document.getElementById("viewAll").onclick = () => {
  window.location.href = "/gallery.html";
};

// INIT
loadMedia();

</script>
