<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Dashboard — MagazStars</title>

  <!-- MAIN CSS GLOBAL -->
  <link rel="stylesheet" href="/main.css" />
</head>

<body class="page">

<!-- =========================
NAVBAR
========================= -->
<nav>
  <div>
    <a href="/index.html">🏠 Home</a>
    <a href="/gallery.html">🎬 Gallery</a>
  </div>

  <div>
    <button id="logout" class="btn">Déconnexion</button>
  </div>
</nav>

<!-- =========================
MAIN CONTAINER
========================= -->
<div class="container">

  <!-- HEADER -->
  <section class="section">
    <div class="header">
      <div>
        <h1>Mon Dashboard</h1>
        <p>Gérez vos médias et votre contenu</p>
      </div>
    </div>
  </section>

  <!-- =========================
UPLOAD ZONE
========================= -->
  <section class="section">

    <div class="upload-zone card" id="uploadZone">
      <p>📤 Cliquer ou glisser un fichier</p>

      <input type="file" id="fileInput" hidden />

      <button class="btn" id="uploadBtn">
        Choisir un fichier
      </button>
    </div>

  </section>

  <!-- =========================
MEDIA LIST
========================= -->
  <section class="section">
    <h2>Mes Médias</h2>

    <div id="mediaContainer" class="grid grid-auto"></div>
  </section>

</div>

<!-- =========================
FOOTER
========================= -->
<footer style="text-align:center; padding:20px; opacity:0.6;">
  <p>© MagazStars Dashboard</p>
</footer>

<!-- =========================
JS (MODULE UNIQUE)
========================= -->
<script type="module" src="/js/dashboard.js"></script>

</body>
</html>
