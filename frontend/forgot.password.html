<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mot de passe oublié – ISJIEE</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="nav">...</nav>
  <main class="container">
    <div class="login-card">
      <h1>🔐 Mot de passe oublié</h1>
      <div id="message" class="message"></div>
      <form id="requestForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email">
        </div>
        <button type="submit" class="btn-primary full-width">Envoyer le lien</button>
      </form>
      <div class="login-footer">
        <a href="/login.html">Retour à la connexion</a>
      </div>
    </div>
  </main>
  <footer class="footer">© ISJIEE – Tous droits réservés</footer>

  <script>
    const form = document.getElementById('requestForm');
    const messageDiv = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const btn = form.querySelector('button');
      btn.disabled = true;
      btn.textContent = 'Envoi...';
      messageDiv.textContent = '';

      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        messageDiv.textContent = data.message || 'Demande envoyée.';
        if (res.ok) form.reset();
      } catch (err) {
        messageDiv.textContent = 'Erreur réseau. Veuillez réessayer.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Envoyer le lien';
      }
    });
  </script>
</body>
</html>
