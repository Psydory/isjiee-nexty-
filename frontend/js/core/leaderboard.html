<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard</title>

<link rel="stylesheet" href="../css/main.css">

<style>
.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.card{
background:#111827;
border-radius:16px;
padding:20px;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
}

th,
td{
padding:15px;
text-align:left;
border-bottom:1px solid rgba(255,255,255,.1);
}

.rank{
font-weight:bold;
font-size:18px;
}

.level{
padding:6px 12px;
border-radius:20px;
font-size:12px;
}

.current-user{
border:2px solid #10b981;
}
</style>

</head>
<body>

<div class="container">

<div class="header">
<h1>🏆 Entrepreneur Leaderboard</h1>
</div>

<div class="card">

<h2>Your Position</h2>

<p>
Rank:
<strong id="myRank">#--</strong>
</p>

<p>
BAR Points:
<strong id="myPoints">0</strong>
</p>

<p>
Level:
<strong id="myLevel">Green Entrepreneur</strong>
</p>

</div>

<div class="card">

<h2>Top Entrepreneurs</h2>

<table>

<thead>
<tr>
<th>Rank</th>
<th>Entrepreneur</th>
<th>Level</th>
<th>Points</th>
</tr>
</thead>

<tbody id="leaderboardTable">

<tr>
<td class="rank">#1</td>
<td>Example User</td>
<td>🟢 Green Entrepreneur</td>
<td>0</td>
</tr>

</tbody>

</table>

</div>

</div>

<script src="../js/leaderboards.js"></script>

</body>
</html>
