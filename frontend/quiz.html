<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz — ISJIEE</title>

  <link rel="stylesheet" href="/css/main.css">

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1f4037, #99f2c8);
      color: #fff;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      padding: 15px 20px;
      background: rgba(0,0,0,0.5);
    }

    .navbar a {
      margin-left: 15px;
      cursor: pointer;
    }

    .hero {
      text-align: center;
      padding: 40px 20px;
    }

    .quiz-container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .question-card {
      background: rgba(255,255,255,0.1);
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    .option {
      display: block;
      margin: 10px 0;
      cursor: pointer;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 15px;
      border: none;
      cursor: pointer;
      background: linear-gradient(45deg, cyan, purple);
      color: #fff;
    }

  </style>
</head>

<body>

<!-- NAV -->
<header class="navbar">
  <div>ISJIEE Quiz</div>
  <nav>
    <a onclick="go('/dashboard-student.html')">Dashboard</a>
    <a onclick="go('/student-program.html')">Programme</a>
    <a onclick="go('/magazstars.html')">MagazStars</a>
    <a id="logoutBtn">Logout</a>
  </nav>
</header>

<!-- HERO -->
<section class="hero">
  <h1>Quiz</h1>
  <p>Testez vos connaissances</p>
</section>

<!-- QUIZ -->
<section class="quiz-container" id="quizContainer">
  <p>Chargement...</p>
</section>

<div style="text-align:center; margin:20px;">
  <button class="btn" onclick="submitQuiz()">Soumettre Quiz</button>
</div>

<script type="module">

import auth from "/js/authSystem.js";
import services from "/js/services.js";
import ui from "/js/uiSystem.js";

// =========================
// NAV
// =========================
window.go = (url) => ui.redirect(url);

// =========================
// AUTH
// =========================
auth.requireAuth();

// =========================
// STATE
// =========================
let questions = [];
let answers = {};

// =========================
// LOAD QUIZ
// =========================
async function loadQuiz() {

  try {

    // ⚠️ si backend n’a pas /quiz → fallback local
    questions = [
      {
        id: "q1",
        text: "Qu'est-ce que HTML ?",
        options: ["Langage de programmation", "Langage de structure", "Base de données"],
        correct: 1
      },
      {
        id: "q2",
        text: "JavaScript sert à ?",
        options: ["Styliser", "Interagir", "Stocker"],
        correct: 1
      }
    ];

    const container = document.getElementById("quizContainer");
    container.innerHTML = "";

    questions.forEach((q, index) => {

      const div = document.createElement("div");
      div.className = "question-card";

      div.innerHTML = `
        <h3>${q.text}</h3>
        ${q.options.map((opt, i) => `
          <label class="option">
            <input type="radio" name="${q.id}" value="${i}">
            ${opt}
          </label>
        `).join("")}
      `;

      container.appendChild(div);
    });

  } catch {
    ui.showError("Erreur chargement quiz");
  }

}

loadQuiz();

// =========================
// SUBMIT QUIZ
// =========================
window.submitQuiz = async () => {

  let score = 0;

  questions.forEach(q => {

    const selected = document.querySelector(`input[name="${q.id}"]:checked`);

    if (selected) {
      const value = Number(selected.value);
      answers[q.id] = value;

      if (value === q.correct) score++;
    }

  });

  try {

    await services.submitTask("quiz", JSON.stringify({
      score,
      total: questions.length,
      answers
    }));

    ui.showSuccess(`Score: ${score}/${questions.length}`);

  } catch {
    ui.showError("Erreur envoi quiz");
  }

};

// =========================
// LOGOUT
// =========================
ui.bindLogout("logoutBtn", auth.logout);

</script>

</body>
</html>
