<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Étudiant — ISJIEE</title>

  <link rel="stylesheet" href="/css/main.css">

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #000428, #004e92);
      color: #fff;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      padding: 15px 20px;
      background: rgba(0,0,0,0.5);
    }

    .navbar a {
      margin-left: 15px;
      cursor: pointer;
      color: #fff;
    }

    .hero {
      text-align: center;
      padding: 40px 20px;
    }

    .section {
      padding: 20px;
    }

    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    .card {
      width: 260px;
      padding: 20px;
      border-radius: 15px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(8px);
      text-align: center;
      box-shadow: 0 0 10px rgba(0,255,255,0.3);
    }

    .progress-bar {
      height: 10px;
      background: #333;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: cyan;
      transition: 0.5s;
    }

  </style>
</head>

<body>

<!-- NAV -->
<header class="navbar">
  <div>ISJIEE</div>
  <nav>
    <a onclick="go('/magazstars.html')">MagazStars</a>
    <a onclick="go('/business.html')">Business</a>
    <a onclick="go('/wiggfluenceur.html')">Wiggfluenceur</a>
    <a id="logoutBtn">Logout</a>
  </nav>
</header>

<!-- HERO -->
<section class="hero">
  <h1 id="username">Bienvenue</h1>
  <p>Votre progression et vos activités</p>
</section>

<!-- STATS -->
<section class="section">
  <div class="cards">

    <div class="card">
      <h3>Progression</h3>
      <div class="progress-bar">
        <div class="progress-fill" id="progressBar"></div>
      </div>
      <p id="progressText">0%</p>
    </div>

    <div class="card">
      <h3>Solde</h3>
      <p id="balance">0 USD</p>
    </div>

  </div>
</section>

<!-- TASKS -->
<section class="section">
  <h2 style="text-align:center;">Tâches</h2>

  <div id="tasksContainer">
    <p>Chargement...</p>
  </div>
</section>

<script type="module">

import auth from "/js/authSystem.js";
import services from "/js/services.js";
import ui from "/js/uiSystem.js";

// =========================
// NAV
// =========================
window.go = (url) => ui.redirect(url);

// =========================
// AUTH
// =========================
auth.requireAuth();

// =========================
// LOAD DASHBOARD
// =========================
async function loadDashboard() {

  try {

    const data = await services.getDashboardData();

    // USER
    ui.setText("username", "Bienvenue " + (data.profile.email || ""));

    // PROGRESS
    const progress = data.progress.percent || 0;
    ui.setText("progressText", progress + "%");
    ui.updateProgressBar("progressBar", progress);

    // BALANCE
    ui.setText("balance", data.balance.amount + " USD");

    // TASKS
    const tasks = await services.getTasks();

    ui.renderCards("tasksContainer", tasks, (t) => `
      <p><strong>${t.type}</strong></p>
      <p>${t.description}</p>
      <p>Status: ${t.status}</p>
    `);

  } catch (err) {
    ui.showError("Erreur chargement dashboard");
  }

}

loadDashboard();

// =========================
// LOGOUT
// =========================
ui.bindLogout("logoutBtn", auth.logout);

</script>

</body>
</html>
