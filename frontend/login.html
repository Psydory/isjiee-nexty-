<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — ISJIEE</title>

  <link rel="stylesheet" href="/css/main.css">

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #000000, #1a1a2e);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      width: 320px;
      padding: 30px;
      border-radius: 15px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      text-align: center;
      box-shadow: 0 0 20px rgba(0,255,255,0.3);
    }

    h2 {
      margin-bottom: 20px;
      color: cyan;
      text-shadow: 0 0 10px cyan;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 10px;
      border: none;
      outline: none;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 20px;
      border: none;
      background: linear-gradient(45deg, cyan, purple);
      color: #fff;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 0 10px cyan;
    }

    button:hover {
      box-shadow: 0 0 20px cyan;
    }

    .link {
      margin-top: 15px;
      display: block;
      cursor: pointer;
      color: #aaa;
    }

  </style>
</head>

<body>

<div class="box">

  <h2>Connexion</h2>

  <form id="loginForm">
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Mot de passe" required>
    <button type="submit">Se connecter</button>
  </form>

  <span class="link" onclick="go('/register.html')">
    Créer un compte
  </span>

</div>

<script type="module">

import auth from "/js/authSystem.js";
import ui from "/js/uiSystem.js";

// =========================
// NAV
// =========================
window.go = (url) => ui.redirect(url);

// =========================
// AUTO REDIRECT SI CONNECTÉ
// =========================
if (auth.isAuthenticated()) {
  ui.redirect("/smart-entry.html");
}

// =========================
// FORM HANDLER
// =========================
ui.handleForm("loginForm", async () => {

  const email = ui.getValue("email");
  const password = ui.getValue("password");

  try {

    const user = await auth.login(email, password);

    ui.showSuccess("Connexion réussie");

    auth.redirectByRole(user);

  } catch (err) {

    ui.showError("Email ou mot de passe incorrect");

  }

});

</script>

</body>
</html>
