<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nouveau mot de passe – ISJIEE</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="nav">...</nav>
  <main class="container">
    <div class="login-card">
      <h1>Nouveau mot de passe</h1>
      <div id="message" class="message"></div>
      <form id="resetForm">
        <div class="form-group">
          <label for="password">Nouveau mot de passe</label>
          <input type="password" id="password" required autocomplete="new-password" aria-label="Nouveau mot de passe">
        </div>
        <div class="form-group">
          <label for="confirm">Confirmer</label>
          <input type="password" id="confirm" required autocomplete="off" aria-label="Confirmation">
        </div>
        <button type="submit" class="btn-primary full-width">Modifier</button>
      </form>
      <div class="login-footer">
        <a href="/login.html">Retour à la connexion</a>
      </div>
    </div>
  </main>
  <footer class="footer">© ISJIEE – Tous droits réservés</footer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    if (!token || token.length < 20) {
      document.getElementById('message').textContent = 'Lien invalide.';
      document.getElementById('resetForm').style.display = 'none';
    }

    const form = document.getElementById('resetForm');
    const messageDiv = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;

      if (password !== confirm) {
        messageDiv.textContent = 'Les mots de passe ne correspondent pas.';
        return;
      }
      // Validation forte côté frontend (redondante avec backend)
      const strongRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
      if (!strongRegex.test(password)) {
        messageDiv.textContent = 'Le mot de passe doit contenir au moins 8 caractères, une majuscule, une minuscule, un chiffre et un caractère spécial.';
        return;
      }

      const btn = form.querySelector('button');
      btn.disabled = true;
      btn.textContent = 'Envoi...';

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword: password })
        });
        const data = await res.json();
        if (res.ok) {
          messageDiv.textContent = data.message;
          setTimeout(() => { window.location.href = '/login.html'; }, 2000);
        } else {
          messageDiv.textContent = data.error || 'Erreur';
        }
      } catch (err) {
        messageDiv.textContent = 'Erreur réseau. Veuillez réessayer.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Modifier';
      }
    });
  </script>
</body>
</html>
