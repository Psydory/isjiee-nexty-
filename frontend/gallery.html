<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Gallery</title>
  <link rel="stylesheet" href="/main.css">
</head>
<body>

  <nav>
    <a href="/index.html">Home</a>
    <a href="/dashboard.html">Dashboard</a>
  </nav>

  <section class="hero">
    <h1>Gallery</h1>
    <p>Vos contenus media</p>
  </section>

  <section id="gallery" class="media-slider"></section>

  <script type="module">

    import UI from "/js/uisystem.js";

    const container = document.getElementById("gallery");

    async function loadMedia() {
      UI.loading(container);

      try {
        const res = await fetch("/media", {
          headers: {
            "Authorization": "Bearer " + localStorage.getItem("token")
          }
        });

        const data = await res.json();

        if (!data.media || data.media.length === 0) {
          UI.empty(container, "Aucun media");
          return;
        }

        renderMedia(data.media);

      } catch (err) {
        UI.error(container, "Erreur chargement");
      }
    }

    function renderMedia(list) {
      container.innerHTML = "";

      list.forEach(m => {

        const card = document.createElement("div");
        card.className = "card";

        const isVideo = m.type === "video";

        card.innerHTML = `
          ${isVideo
            ? `<video src="${m.url}" controls></video>`
            : `<img src="${m.url}" />`
          }

          <p><strong>${m.title || "Sans titre"}</strong></p>
          <p>${m.description || ""}</p>

          <div style="display:flex;justify-content:space-between;padding:10px;">
            <span>❤️ ${m.likes}</span>
            <span>👁 ${m.views}</span>
          </div>

          <button class="btn primary like">Like</button>
          <button class="btn ghost delete">Delete</button>
        `;

        // LIKE
        card.querySelector(".like").onclick = async () => {
          await fetch("/media/like", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": "Bearer " + localStorage.getItem("token")
            },
            body: JSON.stringify({ id: m.id })
          });

          UI.toast("Liked");
          loadMedia();
        };

        // DELETE
        card.querySelector(".delete").onclick = async () => {

          const ok = await UI.confirm("Supprimer ce media ?");
          if (!ok) return;

          await fetch("/media/delete", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": "Bearer " + localStorage.getItem("token")
            },
            body: JSON.stringify({ id: m.id })
          });

          UI.toast("Supprimé");
          loadMedia();
        };

        // VIEW TRACK
        card.onclick = () => {
          fetch("/media/view", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: m.id })
          });
        };

        container.appendChild(card);
      });
    }

    loadMedia();

  </script>

</body>
</html>
